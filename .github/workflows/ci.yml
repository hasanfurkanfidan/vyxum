name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Vyxum_Test_123!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Vyxum_Test_123! -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    env:
      VYXUM_TEST_SQLSERVER: Server=localhost,1433;User Id=sa;Password=Vyxum_Test_123!;TrustServerCertificate=True

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - run: dotnet build -warnaserror -p:SkipUiBuild=true

      - run: dotnet test --no-build -p:SkipUiBuild=true

  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/Web/vyxum-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Web/vyxum-web/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  # The end-to-end screen check (tests/e2e): the real host, agent and a simulated scale, driven in Chromium.
  # The report and every screenshot are uploaded as the "e2e-report" artifact, also when a scenario fails.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/Web/vyxum-web/package-lock.json
            tests/e2e/package-lock.json

      - run: npm ci
        working-directory: tests/e2e

      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - run: npm run typecheck
        working-directory: tests/e2e

      - run: node tests/e2e/run.mjs --out artifacts/e2e/ci --real-url none

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: artifacts/e2e/ci
          if-no-files-found: ignore

  installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Web/vyxum-web/package-lock.json

      - name: Install Inno Setup (skipped when the runner image already has it)
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $known = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if ($iscc -or (Test-Path $known)) { Write-Host 'Inno Setup already installed.'; exit 0 }
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build setup program
        shell: pwsh
        run: ./installer/build-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: VyxumSetup
          path: artifacts/installer/*.exe
          if-no-files-found: error
